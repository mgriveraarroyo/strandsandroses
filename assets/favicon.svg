<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Strands & Roses · favicon · paleta cliente canon -->
  <rect width="100" height="100" rx="18" fill="#E3779B"/>
  <!-- S letterform -->
  <text
    x="50"
    y="56"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="54"
    font-weight="400"
    fill="#FFFFFF"
    letter-spacing="-2"
  >S</text>
  <!-- Thin rule beneath S -->
  <line x1="26" y1="68" x2="74" y2="68" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
  <!-- Ampersand + R in smaller size -->
  <text
    x="50"
    y="82"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="16"
    font-weight="400"
    fill="#FFFFFF"
    letter-spacing="3"
    opacity="0.92"
  >&amp;R</text>
</svg>
